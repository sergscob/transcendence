services:
  backend:
    build: ./back
    container_name: backend
    expose:
      - "8000"

  frontend:
    build: ./front
    container_name: frontend
    expose:
      - "80"
    depends_on:
      - backend

  tls-proxy:
    build: ./infra/nginx-prod
    container_name: tls-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TLS_CERT_CN=localhost
      - TLS_CERT_DAYS=365
    volumes:
      - tls_certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend

volumes:
  tls_certs:
